<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Compos Logo Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Music&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel2: #1e222b;
    --line: #2a2f3a;
    --text: #e6e8ee;
    --dim: #8b93a5;
    --accent: #7c6cff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  header h1 span { color: var(--accent); }
  header .hint { color: var(--dim); font-size: 12px; }
  .spacer { flex: 1; }
  .hgroup { display: flex; align-items: center; gap: 8px; }
  .hgroup label { color: var(--dim); font-size: 12px; }
  main {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 320px;
    min-height: 0;
  }
  #stageWrap {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    min-width: 0;
    overflow: auto;
  }
  #stageBox { position: relative; width: min(78vh, 100%); aspect-ratio: 1 / 1; max-width: 100%; }
  #stage { width: 100%; height: 100%; display: block; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.45); touch-action: none; user-select: none; }
  #stage.checker { background-color: #f4f6fa; background-image: conic-gradient(#dfe4ee 0 25%, #f4f6fa 0 50%, #dfe4ee 0 75%, #f4f6fa 0); background-size: 22px 22px; }
  #stage.white { background: #ffffff; }
  #stage.black { background: #000000; }
  #stage.transparent { background: transparent; }
  aside {
    border-left: 1px solid var(--line);
    background: var(--panel);
    overflow-y: auto;
    padding: 14px;
  }
  section { margin-bottom: 18px; }
  section > h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--dim);
    margin: 0 0 8px;
  }
  .tabs { display: flex; gap: 6px; }
  .tab {
    flex: 1;
    padding: 8px 6px;
    background: var(--panel2);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    cursor: pointer;
    font-size: 12px;
    text-align: center;
  }
  .tab .glyph { font-size: 20px; display: block; line-height: 1; }
  .tab.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .row label { color: var(--dim); font-size: 12px; width: 74px; flex-shrink: 0; }
  .row input[type=range] { flex: 1; }
  .row input[type=number] { width: 64px; }
  input[type=text], input[type=number], select {
    background: var(--panel2);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 13px;
  }
  input[type=color] {
    width: 40px; height: 30px; padding: 0;
    border: 1px solid var(--line); border-radius: 6px;
    background: var(--panel2); cursor: pointer;
  }
  input[type=range] { accent-color: var(--accent); }
  input[type=checkbox] { accent-color: var(--accent); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 7px 10px; border-radius: 7px; border: 1px solid var(--line);
    background: var(--panel2); color: var(--text); cursor: pointer; font-size: 12px;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btnrow { display: flex; gap: 6px; flex-wrap: wrap; }
  .toggle { display: flex; align-items: center; gap: 8px; }
  .toggle label { color: var(--text); font-size: 12px; }
  .chip { font-size: 12px; color: var(--dim); }
  .kbd {
    font-size: 11px; color: var(--dim);
    background: var(--panel2); border: 1px solid var(--line);
    border-radius: 4px; padding: 1px 5px; margin-right: 4px;
  }
  #readout { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header>
  <h1>Compos <span>λ</span> Logo Designer</h1>
  <span class="hint">Three overlapping notations · the overlap becomes the lambda</span>
  <div class="spacer"></div>
  <div class="hgroup">
    <label>Guide</label>
    <input type="checkbox" id="guideChk" checked />
    <input type="range" id="guideOp" min="0" max="0.6" step="0.01" value="0.16" style="width:70px" />
  </div>
  <div class="hgroup">
    <label>Overlap</label>
    <input type="checkbox" id="interChk" checked />
  </div>
  <div class="hgroup">
    <label>BG</label>
    <select id="bgSel">
      <option value="checker">Checker</option>
      <option value="white">White</option>
      <option value="black">Black</option>
      <option value="transparent">Transparent</option>
    </select>
  </div>
  <button class="btn" id="exportSvg">SVG</button>
  <button class="btn" id="exportPng">PNG</button>
  <button class="btn" id="copySvg">Copy SVG</button>
</header>

<main>
  <div id="stageWrap">
    <div id="stageBox">
      <svg id="stage" class="checker" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>

  <aside>
    <section>
      <h2>Layers</h2>
      <div class="tabs" id="tabs"></div>
    </section>

    <section>
      <h2>Selected layer</h2>
      <div class="row">
        <label>Glyph</label>
        <select id="glyphSel" style="flex:1; font-size:20px"></select>
      </div>
      <div class="row">
        <label>Visible</label>
        <input type="checkbox" id="visChk" checked />
        <span class="chip">blend</span>
        <select id="blendSel" style="flex:1">
          <option value="multiply">Multiply</option>
          <option value="screen">Screen</option>
          <option value="normal">Normal</option>
          <option value="difference">Difference</option>
        </select>
      </div>
      <div class="row">
        <label>X</label>
        <input type="number" id="xIn" step="1" />
        <label>Y</label>
        <input type="number" id="yIn" step="1" />
      </div>
      <div class="row">
        <label>Rotate</label>
        <input type="range" id="rotR" min="-180" max="180" step="1" />
        <input type="number" id="rotN" step="1" style="width:56px" />
      </div>
      <div class="row">
        <label>Scale</label>
        <input type="range" id="scaleR" min="0.1" max="6" step="0.01" />
        <input type="number" id="scaleN" step="0.05" style="width:56px" />
      </div>
      <div class="row">
        <label>Opacity</label>
        <input type="range" id="opR" min="0" max="1" step="0.01" />
        <input type="number" id="opN" step="0.05" style="width:56px" />
      </div>
      <div class="row">
        <label>Color</label>
        <input type="color" id="colorIn" />
        <button class="btn" id="flipX">Flip H</button>
        <button class="btn" id="flipY">Flip V</button>
      </div>
      <div class="row">
        <label>Overlap color</label>
        <input type="color" id="interColor" value="#0f172a" />
        <span class="chip" style="margin-left:auto">opacity</span>
        <input type="range" id="interOp" min="0" max="1" step="0.01" value="0.95" style="width:70px" />
      </div>
    </section>

    <section>
      <h2>Quick</h2>
      <div class="btnrow">
        <button class="btn" id="reset">Reset</button>
        <button class="btn" id="shuffle">Shuffle</button>
        <button class="btn" id="snapGuide">Stack</button>
      </div>
    </section>

    <section>
      <h2>Keys</h2>
      <div class="chip">
        <span class="kbd">drag</span>move &nbsp;
        <span class="kbd">scroll</span>scale &nbsp;
        <span class="kbd">⇧scroll</span>rotate &nbsp;
        <span class="kbd">←↑↓→</span>nudge &nbsp;
        <span class="kbd">1</span><span class="kbd">2</span><span class="kbd">3</span>layer
      </div>
    </section>
  </aside>
</main>

<script>
"use strict";

const W = 800, H = 800, CX = 400, CY = 400;
const FONT = '"Noto Music", "Segoe UI Symbol", "Apple Symbols", "Symbola", "DejaVu Sans", "Arial Unicode MS", serif';
const GLYPHS = ["𝄞","𝄢","𝄡","♪","♫","♬","♩","♭","♮","♯","𝄐","𝄆","𝄇","𝄫","𝄪"];

const stage = document.getElementById("stage");

const state = {
  selected: 0,
  bg: "checker",
  guide: true,
  guideOpacity: 0.16,
  showIntersection: true,
  intersectColor: "#0f172a",
  intersectOpacity: 0.95,
  layers: [
    { glyph: "𝄞", x: 400, y: 400, rot: 0,   scale: 1.50, color: "#ff4d6d", opacity: 1, blend: "multiply", flipX: false, flipY: false, visible: true },
    { glyph: "♪", x: 410, y: 415, rot: 12,  scale: 1.60, color: "#38bdf8", opacity: 1, blend: "multiply", flipX: false, flipY: false, visible: true },
    { glyph: "♫", x: 398, y: 440, rot: -8,  scale: 1.40, color: "#fbbf24", opacity: 1, blend: "multiply", flipX: false, flipY: false, visible: true },
  ],
};

const $ = (id) => document.getElementById(id);

function layerTransform(l) {
  const sx = l.scale * (l.flipX ? -1 : 1);
  const sy = l.scale * (l.flipY ? -1 : 1);
  return `translate(${l.x} ${l.y}) rotate(${l.rot}) scale(${sx} ${sy})`;
}

function glyphText(l, fill) {
  return `<text class="glyph" x="0" y="0" font-size="300" text-anchor="middle" dominant-baseline="central" fill="${fill}">${l.glyph}</text>`;
}

function buildMasks() {
  let defs = "";
  const vis = [];
  state.layers.forEach((l, i) => {
    if (!l.visible) return;
    vis.push(i);
    defs += `<mask id="m${i}" maskUnits="userSpaceOnUse" x="0" y="0" width="${W}" height="${H}">` +
      `<rect width="${W}" height="${H}" fill="black"/>` +
      `<g transform="${layerTransform(l)}">${glyphText(l, "#ffffff")}</g>` +
      `</mask>`;
  });
  return { defs, vis };
}

function renderStage() {
  const { defs, vis } = buildMasks();

  let bg = "";
  if (state.bg === "white") bg = `<rect width="${W}" height="${H}" fill="#ffffff"/>`;
  else if (state.bg === "black") bg = `<rect width="${W}" height="${H}" fill="#000000"/>`;

  let guide = "";
  if (state.guide) {
    guide = `<text id="guide" class="glyph" x="${CX}" y="${CY + 8}" font-size="660" text-anchor="middle" dominant-baseline="central" fill="#64748b" opacity="${state.guideOpacity}">λ</text>`;
  }

  const layersHtml = state.layers.map((l, i) => {
    if (!l.visible) return "";
    return `<g data-i="${i}" transform="${layerTransform(l)}" style="mix-blend-mode:${l.blend}">` +
      `<text class="glyph" x="0" y="0" font-size="300" text-anchor="middle" dominant-baseline="central" fill="${l.color}" opacity="${l.opacity}">${l.glyph}</text>` +
      `</g>`;
  }).join("");

  let inter = "";
  if (state.showIntersection && vis.length) {
    let inner = `<rect x="0" y="0" width="${W}" height="${H}" fill="${state.intersectColor}"/>`;
    for (const i of vis) inner = `<g mask="url(#m${i})">${inner}</g>`;
    inter = `<g opacity="${state.intersectOpacity}">${inner}</g>`;
  }

  const sel = state.layers[state.selected];
  const ring = sel.visible
    ? `<circle cx="${sel.x}" cy="${sel.y}" r="${Math.max(46, 210 * sel.scale)}" fill="none" stroke="#7c6cff" stroke-width="2" stroke-dasharray="7 5" opacity="0.95"/>`
    : "";

  stage.innerHTML =
    `<style>.glyph{font-family:${FONT}}</style>` +
    `<defs>${defs}</defs>` +
    bg +
    guide +
    layersHtml +
    inter +
    `<g id="ui">${ring}</g>`;

  stage.setAttribute("class", state.bg);
}

// ---- controls sync ----
function setVal(id, val) {
  const el = $(id);
  if (document.activeElement !== el) el.value = val;
}

function syncControls() {
  const l = state.layers[state.selected];
  // tabs
  const tabs = document.querySelectorAll(".tab");
  tabs.forEach((t, i) => {
    const L = state.layers[i];
    t.innerHTML = `<span class="glyph">${L.glyph}</span>${L.visible ? "" : "· hidden"}`;
    t.classList.toggle("active", i === state.selected);
    t.style.opacity = L.visible ? 1 : 0.4;
  });

  const glyphSel = $("glyphSel");
  if (glyphSel.options.length !== GLYPHS.length) {
    glyphSel.innerHTML = GLYPHS.map((g) => `<option value="${g}">${g}</option>`).join("");
  }
  glyphSel.value = l.glyph;

  setVal("visChk", l.visible);
  $("visChk").checked = l.visible;
  setVal("blendSel", l.blend);
  setVal("xIn", Math.round(l.x));
  setVal("yIn", Math.round(l.y));
  setVal("rotR", l.rot);
  setVal("rotN", l.rot);
  setVal("scaleR", l.scale);
  setVal("scaleN", l.scale.toFixed(2));
  setVal("opR", l.opacity);
  setVal("opN", l.opacity);
  setVal("colorIn", l.color);
  setVal("interColor", state.intersectColor);
  setVal("interOp", state.intersectOpacity);
  setVal("guideOp", state.guideOpacity);
  setVal("bgSel", state.bg);
  $("guideChk").checked = state.guide;
  $("interChk").checked = state.showIntersection;
  $("flipX").textContent = "Flip H" + (l.flipX ? " ✓" : "");
  $("flipY").textContent = "Flip V" + (l.flipY ? " ✓" : "");
}

function render() { renderStage(); syncControls(); }

// ---- layer transforms ----
function mutLayer(fn) {
  fn(state.layers[state.selected]);
  renderStage();
  syncControls();
}

// ---- stage interactions ----
let dragging = null;

function svgPoint(e) {
  const r = stage.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
}

function hitLayer(p) {
  let best = -1, bestD = Infinity;
  state.layers.forEach((l, i) => {
    if (!l.visible) return;
    const dx = p.x - l.x, dy = p.y - l.y;
    const d = dx * dx + dy * dy;
    const r = 150 * l.scale;
    if (d <= r * r && d < bestD) { best = i; bestD = d; }
  });
  return best;
}

stage.addEventListener("pointerdown", (e) => {
  const p = svgPoint(e);
  const i = hitLayer(p);
  if (i >= 0) {
    state.selected = i;
    const l = state.layers[i];
    dragging = { i, dx: l.x - p.x, dy: l.y - p.y, moved: false };
    stage.setPointerCapture(e.pointerId);
    render();
  }
});

stage.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  const p = svgPoint(e);
  const l = state.layers[dragging.i];
  const nx = p.x + dragging.dx, ny = p.y + dragging.dy;
  if (Math.abs(nx - l.x) > 0.5 || Math.abs(ny - l.y) > 0.5) dragging.moved = true;
  l.x = nx; l.y = ny;
  renderStage(); syncControls();
});

stage.addEventListener("pointerup", (e) => { dragging = null; });

stage.addEventListener("wheel", (e) => {
  e.preventDefault();
  const l = state.layers[state.selected];
  const k = e.deltaY > 0 ? -0.05 : 0.05;
  if (e.shiftKey) l.rot += e.deltaY > 0 ? -5 : 5;
  else l.scale = Math.min(6, Math.max(0.1, l.scale + k));
  renderStage(); syncControls();
}, { passive: false });

window.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  const l = state.layers[state.selected];
  const step = e.shiftKey ? 10 : 1;
  switch (e.key) {
    case "ArrowLeft": l.x -= step; break;
    case "ArrowRight": l.x += step; break;
    case "ArrowUp": l.y -= step; break;
    case "ArrowDown": l.y += step; break;
    case "1": case "2": case "3": state.selected = +e.key - 1; break;
    case "g": state.guide = !state.guide; break;
    case "i": state.showIntersection = !state.showIntersection; break;
    default: return;
  }
  e.preventDefault();
  render();
});

// ---- control bindings ----
$("glyphSel").addEventListener("change", (e) => mutLayer((l) => { l.glyph = e.target.value; }));
$("visChk").addEventListener("change", (e) => mutLayer((l) => { l.visible = e.target.checked; }));
$("blendSel").addEventListener("change", (e) => mutLayer((l) => { l.blend = e.target.value; }));
$("xIn").addEventListener("input", (e) => mutLayer((l) => { l.x = +e.target.value || 0; }));
$("yIn").addEventListener("input", (e) => mutLayer((l) => { l.y = +e.target.value || 0; }));
$("rotR").addEventListener("input", (e) => mutLayer((l) => { l.rot = +e.target.value; }));
$("rotN").addEventListener("input", (e) => mutLayer((l) => { l.rot = +e.target.value; }));
$("scaleR").addEventListener("input", (e) => mutLayer((l) => { l.scale = +e.target.value; }));
$("scaleN").addEventListener("input", (e) => mutLayer((l) => { l.scale = +e.target.value; }));
$("opR").addEventListener("input", (e) => mutLayer((l) => { l.opacity = +e.target.value; }));
$("opN").addEventListener("input", (e) => mutLayer((l) => { l.opacity = +e.target.value; }));
$("colorIn").addEventListener("input", (e) => mutLayer((l) => { l.color = e.target.value; }));
$("flipX").addEventListener("click", () => mutLayer((l) => { l.flipX = !l.flipX; }));
$("flipY").addEventListener("click", () => mutLayer((l) => { l.flipY = !l.flipY; }));
$("interColor").addEventListener("input", (e) => { state.intersectColor = e.target.value; renderStage(); });
$("interOp").addEventListener("input", (e) => { state.intersectOpacity = +e.target.value; renderStage(); });

$("guideChk").addEventListener("change", (e) => { state.guide = e.target.checked; renderStage(); });
$("guideOp").addEventListener("input", (e) => { state.guideOpacity = +e.target.value; renderStage(); });
$("interChk").addEventListener("change", (e) => { state.showIntersection = e.target.checked; renderStage(); });
$("bgSel").addEventListener("change", (e) => { state.bg = e.target.value; renderStage(); });

$("tabs").addEventListener("click", (e) => {
  const t = e.target.closest(".tab");
  if (!t) return;
  state.selected = +t.getAttribute("data-i");
  render();
});

$("reset").addEventListener("click", () => {
  state.layers = [
    { glyph: "𝄞", x: 400, y: 400, rot: 0,   scale: 1.50, color: "#ff4d6d", opacity: 1, blend: "multiply", flipX: false, flipY: false, visible: true },
    { glyph: "♪", x: 410, y: 415, rot: 12,  scale: 1.60, color: "#38bdf8", opacity: 1, blend: "multiply", flipX: false, flipY: false, visible: true },
    { glyph: "♫", x: 398, y: 440, rot: -8,  scale: 1.40, color: "#fbbf24", opacity: 1, blend: "multiply", flipX: false, flipY: false, visible: true },
  ];
  state.selected = 0;
  render();
});

$("shuffle").addEventListener("click", () => {
  state.layers.forEach((l) => {
    l.glyph = GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
    l.x = 200 + Math.random() * 400;
    l.y = 200 + Math.random() * 400;
    l.rot = Math.round(Math.random() * 60 - 30);
    l.scale = +(0.9 + Math.random() * 0.9).toFixed(2);
  });
  render();
});

// Stack all three glyphs at center for maximum overlap, then sculpt outward.
$("snapGuide").addEventListener("click", () => {
  state.layers[0].x = 400; state.layers[0].y = 400; state.layers[0].rot = 0;  state.layers[0].scale = 1.5;
  state.layers[1].x = 410; state.layers[1].y = 415; state.layers[1].rot = 12; state.layers[1].scale = 1.6;
  state.layers[2].x = 398; state.layers[2].y = 440; state.layers[2].rot = -8; state.layers[2].scale = 1.4;
  render();
});

// ---- export ----
function exportableSVG() {
  const clone = stage.cloneNode(true);
  clone.querySelector("#ui")?.remove();
  clone.querySelector("#guide")?.remove();
  clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
  clone.setAttribute("width", W);
  clone.setAttribute("height", H);
  clone.removeAttribute("class");
  return new XMLSerializer().serializeToString(clone);
}

function download(name, url) {
  const a = document.createElement("a");
  a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

$("exportSvg").addEventListener("click", () => {
  const blob = new Blob([exportableSVG()], { type: "image/svg+xml;charset=utf-8" });
  download("compos-logo.svg", URL.createObjectURL(blob));
});

$("copySvg").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(exportableSVG());
    $("copySvg").textContent = "Copied ✓";
    setTimeout(() => { $("copySvg").textContent = "Copy SVG"; }, 1200);
  } catch {
    alert("Clipboard blocked. Use the SVG download instead.");
  }
});

$("exportPng").addEventListener("click", () => {
  const svgText = exportableSVG();
  const blob = new Blob([svgText], { type: "image/svg+xml;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = () => {
    const scale = 2;
    const canvas = document.createElement("canvas");
    canvas.width = W * scale; canvas.height = H * scale;
    const ctx = canvas.getContext("2d");
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0, W, H);
    URL.revokeObjectURL(url);
    canvas.toBlob((png) => {
      download("compos-logo.png", URL.createObjectURL(png));
    }, "image/png");
  };
  img.onerror = () => { alert("PNG export failed in this browser."); };
  img.src = url;
});

// Build the three layer tab buttons once.
{
  const tabsEl = $("tabs");
  state.layers.forEach((_, i) => {
